#####################################################
# Set default terminal
#####################################################
# set -g default-terminal "xterm-kitty"
# set-option -ga terminal-overrides ",xterm-kitty:Tc"

# set -g default-terminal "tmux-256color"
# set -g terminal-overrides ",xterm-256color:Tc"

set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

####################################################
# Set prefix
####################################################
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

#####################################################
# Reload config
#####################################################
unbind r
bind -n C-r source-file ~/.config/tmux/tmux.conf

#####################################################
# Vim style pane selection
#####################################################
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R


# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

#####################################################
# set options
#####################################################
set -g mouse on
#set -g default-shell /bin/fish
set -g repeat-time 1000
set-option -g status-position bottom
set-option -g status-style bg=#1e1e2e,fg=white
set-option -g status-left "#[fg=green,bold] #S "
set-option -g status-justify right
set-window-option -g window-status-format " #[fg=gray]#W "
set-window-option -g window-status-current-style bg=default,fg=white,bold
set-window-option -g window-status-current-format " #[fg=white]#W "
set-option -g status-right ""

#####################################################
# Shift arrow to switch windows
#####################################################
bind -n S-Left  previous-window
bind -n S-Right next-window

#####################################################
# Shift Alt vim keys to switch windows
#####################################################
bind -n M-H previous-window
bind -n M-L next-window

#####################################################
# TokyoNight colors for Tmux
#####################################################
set -g @tokyo-night-tmux_show_datetime 1
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_path_format relative
set -g @tokyo-night-tmux_window_id_style dsquare
set -g @tokyo-night-tmux_window_id_style dsquare
set -g @tokyo-night-tmux_show_git 1


#####################################################
# List of plugins
#####################################################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other plugins:
set -g @plugin 'jimeh/tmuxifier'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @plugin 'tmux-plugins/tmux-yank'         

#####################################################
# Copy mode bindings for vi
#####################################################
# set vi-mode
set-window-option -g mode-keys vi
set -g @yank_action 'copy-pipe'
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

#####################################################
# split pane bindings
#####################################################
bind -n C-u split-window -v -c "#{pane_current_path}"
bind -n C-y split-window -h -c "#{pane_current_path}"
bind -n C-x kill-pane

#####################################################
# new panes
#####################################################
bind -n C-c new-window -c "#{pane_current_path}"


#####################################################
# resize panes
#####################################################
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5
bind -n M-H resize-pane -L 5


#####################################################
# maximize
#####################################################
bind -r m resize-pane -Z
bind -n M-M resize-pane -Z

#####################################################
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
#####################################################
run '~/.config/tmux/plugins/tpm/tpm'
