[mgr]
ratio = [2, 4, 4]
show_hidden = false
show_symlink = true
sort_by = "natural"
sort_sensitive = false
sort_dir_first = true
mouse_events = ["click", "scroll"]
scrolloff = 10
linemode = "size"

[open]
rules = [
  # 1. Folders first
  { url = "*/", use = ["enter"] },

  # 2. Specific types (Now including the custom command prompts)
  { mime = "text/*", use = ["edit", "ask-cmd-block", "open"] },
  { mime = "image/*", use = ["open"] },
  { mime = "video/*", use = ["open"] },
  { mime = "application/pdf", use = ["open"] },
  { mime = "application/vnd.openxmlformats-officedocument*", use = ["open", "ask-cmd-bg"] },
  { mime = "document/*", use = ["edit", "ask-cmd-block", "open"] },
  
  # 3. Catch-alls at the very bottom
  { mime = "*/*", use = ["open"] },
  { url = "*", use = ["open"] },
]

[opener]
edit = [
  { run = 'nvim "$@"', block = true, desc = "Neovim", for = "unix" },
  { run = '$EDITOR "$@"', block = true, for = "unix" },
]
open = [
  { run = 'xdg-open "$1"', desc = "Open", orphan = true, for = "linux" }
]
copy-content = [
  { run = 'cat "$1" | xclip -sel clipboard', for = "linux" }
]
# Hooks for the open-with-cmd plugin directly into the "Open With..." menu
ask-cmd-block = [
  { run = 'plugin open-with-cmd --args="-- block"', block = true, desc = "Command Prompt (Blocking)", for = "unix" }
]
ask-cmd-bg = [
  { run = 'plugin open-with-cmd', desc = "Command Prompt (Background)", for = "unix" }
]

[filetype]
rules = [
  { url = "*", is = "hidden", fg = "cyan" },
]   

[preview]
image_quality = 90
max_width = 3000
max_height = 2000

