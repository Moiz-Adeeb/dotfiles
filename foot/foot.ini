# Minimalist Foot Configuration
[main]
font=JetBrainsMono Nerd Font Propo:size=12
#font=FiraCode Nerd Font:size=12

pad=1x1
shell=/usr/bin/fish --login
dpi-aware=no
initial-window-mode=windowed


[scrollback]
lines=2000
multiplier=5.0


[cursor]
style=block
blink=no


[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.9
background=11111b
#16161e
#242933
foreground=e5e9f0

## Normal colors
regular0=2e3440  # black (darker slate)
regular1=bf616a  # red
regular2=a3be8c  # green
regular3=ebcb8b  # yellow
regular4=81a1c1  # blue
regular5=b48ead  # magenta
regular6=88c0d0  # cyan
regular7=eceff4  # white (brightest crisp white)

## Bright colors
bright0=4c566a   # bright black
bright1=d08770   # bright red (shifted to aurora orange-red for contrast)
bright2=b5cea8   # bright green
bright3=f0dfaf   # bright yellow
bright4=8fbcbb   # bright blue
bright5=c6a0cd   # bright magenta
bright6=a3ecec   # bright cyan
bright7=ffffff   # bright white

## Selection/Cursor high contrast overrides
selection-background=434c5e
selection-foreground=ffffff


